# ---------------------------------------------------------------------------
# APS Queimadas - configuracao padrao
# Para sobrescrever sem recompilar: crie "aps.properties" na pasta onde o
# programa e executado, ou use -Daps.chave=valor na linha de comando.
# ---------------------------------------------------------------------------

# Unidade federativa atribuida ao grupo e anos exigidos pelo enunciado
aps.uf=SP
aps.anos=2023,2024

# Pasta com os CSVs do INPE (focos_br_sp_ref_2023.csv, focos_br_sp_ref_2024.csv)
aps.dados.diretorio=data/raw

# Pasta onde os relatorios (CSV, Excel, PDF) sao gravados
aps.relatorios.diretorio=relatorios

# Diretorio publico do INPE (satelite de referencia, por estado)
aps.inpe.url=https://dataserver-coids.inpe.br/queimadas/queimadas/focos/csv/anual/EstadosBr_sat_ref/

# Algoritmos O(n^2) exibem aviso quando a amostra passa deste tamanho
aps.ordenacao.limiteQuadratico=20000

# Benchmark (modo "benchmark" da linha de comando)
aps.benchmark.tamanhos=100,1000,5000,10000,0
aps.benchmark.aquecimentos=2
aps.benchmark.aquecimentoMs=500
aps.benchmark.repeticoes=5
aps.benchmark.semente=42

# Machine Learning
aps.ml.arvores=200
aps.ml.k=8
aps.ml.epsKm=10
aps.ml.minPts=30
